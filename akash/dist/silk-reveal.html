<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#0a0506;color:#f6ece4}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Akash Sarees — Silk Reveal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  --bg: #0a0506;
  --fg: #f6ece4;
  --muted: #cdb9ad;
  --accent: #e0b25a;
  --silk: #b3121f;
  --scrim: rgba(8, 3, 4, 0.82);
  --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { color-scheme: dark; } }
body { background: var(--bg); color: var(--fg); font-family: var(--body); margin: 0; }
html { scroll-behavior: auto; }

.track { height: 600vh; position: relative; background: var(--bg); }
.stage { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; background: var(--bg); }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.scrim { position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(to top, var(--scrim) 0%, rgba(8,3,4,0.45) 34%, rgba(8,3,4,0) 62%),
    linear-gradient(to bottom, rgba(8,3,4,0.5), rgba(8,3,4,0) 22%); }

.wrap { position: absolute; inset: 0; box-sizing: border-box;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
  padding-block: 24px 32px; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 16px;
  font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
.top .brand { font-weight: 700; color: var(--accent); letter-spacing: 0.28em; }

.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(246,236,228,0.12); }
.bar b { display: block; height: 100%; width: 0; background: var(--silk); box-shadow: 0 0 12px var(--silk); }
.hint { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); font-size: 0.68rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 8px; transition: opacity 0.4s; }
.hint::after { content: ""; width: 1px; height: 28px; background: linear-gradient(var(--accent), transparent); animation: drip 1.8s ease-in-out infinite; }
@keyframes drip { 0% { transform: scaleY(0); transform-origin: top; } 50% { transform: scaleY(1); transform-origin: top; } 51% { transform-origin: bottom; } 100% { transform: scaleY(0); transform-origin: bottom; } }
.loader { position: absolute; top: 56px; left: max(24px, env(safe-area-inset-left, 0px)); font-size: 0.68rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); transition: opacity 0.6s; font-variant-numeric: tabular-nums; }
@media (max-width: 700px) { .hint { display: none; } }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;600&display=swap">

<main class="track" id="track">
  <div class="stage">
    <canvas id="cv" aria-label="Red silk unfurling to reveal a saree showroom, controlled by scrolling" role="img"></canvas>
    <div class="scrim"></div>
    <div class="wrap">
      <div class="top">
        <span class="brand">AKASH SAREES</span>
        <span style="letter-spacing:0.18em;">THE HOUSE OF WEAVES</span>
      </div>
      <div id="endCta" style="opacity:0;transition:opacity 0.4s ease, transform 0.4s ease;transform:translateY(18px);pointer-events:none;">
        <p style="margin:0;"><a href="akash/dist/index.html" style="display:inline-block;padding:15px 32px;background:#e0b25a;color:#0a0506;text-decoration:none;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;font-size:0.75rem;border-radius:3px;box-shadow:0 6px 24px rgba(224,178,90,0.4);pointer-events:auto;transition:transform 0.3s, background 0.3s;">Enter Akash Sarees Store &rarr;</a></p>
      </div>
    </div>
    <div class="loader" id="loader">Loading 0%</div>
    <div class="hint" id="hint">Scroll</div>
    <div class="bar"><b id="prog"></b></div>
  </div>
</main>

<script>
(function () {
  var FPS = 24, FRAMES = 159;
  var cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  ctx.imageSmoothingQuality = "high";
  var track = document.getElementById("track");
  var prog = document.getElementById("prog");
  var hint = document.getElementById("hint"), loader = document.getElementById("loader");
  var endCta = document.getElementById("endCta");
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  var current = 0, seeking = false, pendingFrame = null, shown = -1;
  var video = document.createElement("video");
  video.muted = true; video.playsInline = true; video.preload = "auto";

  function maxScroll() { return track.offsetHeight - window.innerHeight; }
  function scrollToProgress(p) {
    var top = track.getBoundingClientRect().top + window.scrollY;
    window.scrollTo({ top: top + p * maxScroll(), behavior: reduce ? "auto" : "smooth" });
  }
  function progress() {
    var top = track.getBoundingClientRect().top;
    var m = maxScroll();
    return m > 0 ? Math.min(1, Math.max(0, -top / m)) : 0;
  }

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(cv.clientWidth * dpr);
    cv.height = Math.round(cv.clientHeight * dpr);
    paint();
  }

  function paint() {
    if (video.readyState < 2) return;
    var cw = cv.width, ch = cv.height;
    var vw = video.videoWidth || 1920, vh = video.videoHeight || 1080;
    var s = Math.max(cw / vw, ch / vh);
    var dw = vw * s, dh = vh * s;
    ctx.drawImage(video, (cw - dw) / 2, (ch - dh) / 2, dw, dh);
  }

  function seek(frame) {
    if (seeking) { pendingFrame = frame; return; }
    if (frame === shown) return;
    seeking = true; shown = frame;
    var dur = video.duration || (FRAMES / FPS);
    var targetTime = Math.max(0, Math.min(dur - 0.02, (frame + 0.5) / FPS));
    video.currentTime = targetTime;
  }

  video.addEventListener("seeked", function () {
    paint();
    seeking = false;
    if (pendingFrame !== null) {
      var f = pendingFrame; pendingFrame = null; seek(f);
    }
  });

  function updateUI(p) {
    if (endCta) {
      var ctaO = Math.max(0, Math.min(1, (p - 0.72) / 0.16));
      endCta.style.opacity = ctaO;
      endCta.style.transform = "translateY(" + ((1 - ctaO) * 18) + "px)";
      endCta.style.pointerEvents = ctaO > 0.5 ? "auto" : "none";
    }
    prog.style.width = (p * 100).toFixed(2) + "%";
    hint.style.opacity = p > 0.03 ? 0 : 1;
  }

  function tick() {
    var p = progress();
    var target = p * (FRAMES - 1);
    current = reduce ? target : current + (target - current) * 0.18;
    if (Math.abs(target - current) < 0.01) current = target;
    seek(Math.round(current));
    updateUI(p);
    requestAnimationFrame(tick);
  }

  async function start() {
    var src = "video.mp4";
    try {
      var res = await fetch("video.mp4");
      var total = +res.headers.get("content-length") || 0;
      var reader = res.body ? res.body.getReader() : null;
      if (reader) {
        var chunks = [], got = 0;
        for (;;) {
          var part = await reader.read();
          if (part.done) break;
          chunks.push(part.value); got += part.value.length;
          if (total) {
            var v = Math.round(got / total * 100);
            loader.textContent = "Loading " + v + "%";
          }
        }
        src = URL.createObjectURL(new Blob(chunks, { type: "video/mp4" }));
      }
    } catch (e) { /* fallback */ }
    video.src = src;
    await new Promise(function (r) {
      video.addEventListener("loadeddata", r, { once: true });
      video.load();
    });
    loader.style.opacity = 0;
    resize();
    window.addEventListener("resize", resize);
    video.currentTime = 0.5 / FPS;
    requestAnimationFrame(tick);
  }

  start();
})();
</script>
</body></html>
